<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervals.icu Wellness Upload</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 0px; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; font-size: 12px; }
    button { background: #007bff; color: white; padding: 12px; border: none; width: 100%; cursor: pointer; }
    button:hover { background: #0056b3; }
    #status { margin-top: 20px; padding: 10px; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    label { font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Upload Wellness to Intervals</h1>

 <button onclick="connectFitbit()">Connect Fitbit</button>
  
  <form id="wellnessForm">
    <label for="weightInput">Weight (kg):</label>
    <input type="number" id="weightInput" step="0.1" min="60" >

    <label for="sleepInput">Sleep Duration (e.g. 7h30m):</label>
    <input type="text" id="sleepInput" >

    <label for="readinessInput">Daily Readiness:</label>
    <input type="number" id="readinessInput" step="1" min="0" >

    <label for="respirationInput">Breathing Rate:</label>
    <input type="number" id="respirationInput" step="1" min="0" >

    <label for="spo2Input">Blood Oxygen (%):</label>
    <input type="number" id="spo2Input" step="1" min="0" maz="100" >

    <label for="rhrInput">Resting Heart Rate (bpm):</label>
    <input type="number" id="rhrInput" min="30" max="100" step="1" >

    <label for="hrvInput">Heart Rate Variability (ms):</label>
    <input type="number" id="hrvInput" step="1" min="0" >

    <label for="vo2maxInput">Cardio Fitness Score:</label>
    <input type="number" id="vo2maxInput" step="1" min="0" >

    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>

  <script>

  if (location.search.includes('fitbit=authorized')) loadData();

//--------------------------------------------------------------------------------
  function connectFitbit() {
  const authUrl = `https://www.fitbit.com/oauth2/authorize?` +
    `client_id=23TZ3L&` +  // Your Client ID
    `redirect_uri=https://chr1sg1thub.github.io/MyFitbit/callback.html&` +
    `response_type=token&` +
    `scope=activity%20heartrate%20sleep%20respiratory_rate%20oxygen_saturation%20cardio_fitness%20weight`;  // Add scopes as needed
  
  location.href = authUrl;
}

//--------------------------------------------------------------------------------
async function loadData() {
  const token = localStorage.getItem('fitbit_token');
  document.getElementById('data').innerHTML = 'Loading...';

  const now = new Date();
const year = now.getFullYear();
const month = String(now.getMonth() + 1).padStart(2, '0');
const day = String(now.getDate()).padStart(2, '0');
const dateStr = `${year}-${month}-${day}`;

  document.getElementById('data').innerHTML = `
    <h2>Today</h2>
  `;

  let res, data;

//  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/body/log/weight/date/${dateStr}.json&token=${encodeURIComponent(token)}`);
//  data = await res.json();

//  let weight = null;
//  if (data?.weight[0]?.weight !== undefined) weight = data.weight[0].weight;
  
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1.2/user/-/sleep/date/${dateStr}.json&token=${encodeURIComponent(token)}`);
  data = await res.json();

  let minutesAsleep = null;
  if (data?.sleep[0]?.minutesAsleep !== undefined) minutesAsleep = data.sleep[0].minutesAsleep;
  
   document.getElementById('sleepInput').value = minutesAsleep;
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/br/date/today.json&token=${encodeURIComponent(token)}`);
  data = await res.json();

  let breathingRate = null;
  if (data?.br[0]?.value?.breathingRate !== undefined) breathingRate = data.br[0].value.breathingRate;
  
   document.getElementById('respirationInput').value = breathingRate;
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/spo2/date/today.json&token=${encodeURIComponent(token)}`);
  data = await res.json();

  let spo2 = null;
  if (data?.value?.avg !== undefined) spo2 = data.value.avg;
  
   document.getElementById('spo2Input').value = spo2;
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/activities/heart/date/today/1d.json&token=${encodeURIComponent(token)}`);
  data = await res.json();
  
  let restingHeartRate = null;
  if ( data['activities-heart'][0]?.value?.restingHeartRate !== undefined) restingHeartRate = data['activities-heart'][0].value.restingHeartRate;
  
   document.getElementById('rhrInput').value = restingHeartRate;
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/hrv/date/today.json&token=${encodeURIComponent(token)}`);
  data = await res.json();

  let hrv = null;
  if ( data?.hrv[0]?.value?.dailyRmssd !== undefined) hrv =  data.hrv[0].value.dailyRmssd;
  
   document.getElementById('hrvInput').value = hrv;
  
  res = await fetch(`https://my-fitbit.vercel.app/api/fitbit?endpoint=/1/user/-/cardioscore/date/today.json&token=${encodeURIComponent(token)}`);
  data = await res.json();

  let vo2MaxStr = null;
  if ( data?.cardioScore[0]?.value?.vo2Max !== undefined) vo2MaxStr =  data.cardioScore[0].value.vo2Max;

  const parts = vo2MaxStr.split('-');
const vo2MaxMin = parseInt(parts[0], 10);
const vo2MaxMax = parseInt(parts[1], 10);
  const vo2Max = (vo2MaxMax + vo2MaxMin)/2;

   document.getElementById('vo2maxInput').value = vo2Max;
}

    //----------------------------------------------------------------------------
    function loadWeight() {
      const data = localStorage.getItem('numbers');
      return data ? JSON.parse(data) : {};
    }
//----------------------------------------------------------------------------
    const weightData = loadWeight();

    const mostRecentValue = Object.entries(weightData)
  .reduce((best, cur) => new Date(cur[0]) > new Date(best[0]) ? cur : best)[1];

    document.getElementById('weightInput').value = mostRecentValue;

//----------------------------------------------------------------------------
function durationToSeconds(str) {
  const hoursMatch = str.match(/(\d+)h/i);
  const minutesMatch = str.match(/(\d+)m/i);
  const hours = hoursMatch ? parseInt(hoursMatch[1], 10) : 0;
  const minutes = minutesMatch ? parseInt(minutesMatch[1], 10) : 0;
  return hours * 3600 + minutes * 60;
}
//----------------------------------------------------------------------------
 

//----------------------------------------------------------------------------
    async function uploadWellness(weight, sleep, readiness, respiration, spo2, rhr, hrv, vo2max) {
      const today = new Date();
 //     today.setDate(today.getDate() + 1);     // Adds one day

 //     today.setHours(0, 0, 0, 0);
      const dateStr = today.toISOString().split('T')[0];

      const data = {
        date: dateStr,
        weight: parseFloat(weight) || null,
        sleepSecs: parseInt(durationToSeconds(sleep)) || null,  //hours & mins to seconds
        readiness: parseInt(readiness) || null,
        respiration: parseInt(respiration) || null,
        spO2: parseInt(spo2) || null,
        restingHR: parseInt(rhr) || null,
        hrv: parseInt(hrv * 3) || null,  //suggested multiplier
        vo2max: parseInt(vo2max) || null
      };

      const url = `https://update-intervals.vercel.app/api/wellness`;

      try {

const response = await fetch(url, {
  method: 'PUT',
  headers: {
//    'Authorization': `Basic ${auth}`,
    'Content-Type': 'application/json'
  },
  body: JSON.stringify(data)
});


        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errText}`);
        }

        return await response.json();
      } catch (error) {
        throw new Error(`Upload failed: ${error.message}`);
      }
    }

    document.getElementById('wellnessForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Uploading...';
      statusEl.className = '';

      try {
        const weight = document.getElementById('weightInput').value;
        const sleep = document.getElementById('sleepInput').value;
        const readiness = document.getElementById('readinessInput').value;
        const respiration = document.getElementById('respirationInput').value;
        const spo2 = document.getElementById('spo2Input').value;
        const rhr = document.getElementById('rhrInput').value;
        const hrv = document.getElementById('hrvInput').value;
        const vo2max = document.getElementById('vo2maxInput').value;

        const result = await uploadWellness(weight, sleep, readiness, respiration, spo2, rhr, hrv, vo2max);
        statusEl.textContent = 'Success! Data uploaded for ' + new Date().toDateString();
        statusEl.className = 'success';
      } catch (error) {
        statusEl.textContent = error.message;
        statusEl.className = 'error';
      }
    });
//----------------------------------------------------------------------------
    
  </script>
</body>
</html>
